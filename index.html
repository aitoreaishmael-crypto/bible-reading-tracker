<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Reading Tracker</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f3ec; --card:#ffffff; --ink:#26221c; --muted:#7a7266; --line:#e6e0d3;
  --accent:#8a5a2b; --accent-ink:#ffffff; --accent-soft:#f1e6d6; --bar:#e9e2d3; --danger:#a8382e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181613; --card:#221f1a; --ink:#f0ebe1; --muted:#a39a8a; --line:#38332b;
    --accent:#d9a566; --accent-ink:#1c1710; --accent-soft:#332a1d; --bar:#332e26; --danger:#e06a5d;
  }
}
:root[data-theme="dark"]{
  --bg:#181613; --card:#221f1a; --ink:#f0ebe1; --muted:#a39a8a; --line:#38332b;
  --accent:#d9a566; --accent-ink:#1c1710; --accent-soft:#332a1d; --bar:#332e26; --danger:#e06a5d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:1.5rem;margin:0 0 4px;text-align:center;letter-spacing:.01em}
.sub{text-align:center;color:var(--muted);font-size:.95rem;margin:0 0 22px;font-family:Arial,Helvetica,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.stat .num{font-size:2.2rem;font-weight:bold;line-height:1.1}
.stat .lbl{font-family:Arial,Helvetica,sans-serif;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden;margin:16px 0 6px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .4s}
.pct{text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:.85rem;color:var(--muted)}
.pick{text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.pick .hint{color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:.95rem}
.pick .chap{font-size:2.3rem;font-weight:bold;line-height:1.15;word-break:break-word}
.pick .tag{font-family:Arial,Helvetica,sans-serif;font-size:.8rem;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
button{font:inherit;font-family:Arial,Helvetica,sans-serif;font-size:1rem;border-radius:10px;padding:12px 20px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:bold;min-width:140px}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{border:none;background:none;color:var(--muted);padding:6px 8px;font-size:.85rem;text-decoration:underline}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;justify-content:center}
.seg button{border:none;border-radius:0;padding:8px 14px;font-size:.85rem;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:bold}
.center{text-align:center}
h2{font-size:1.05rem;margin:0}
ul{list-style:none;margin:12px 0 0;padding:0;max-height:340px;overflow-y:auto}
li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid var(--line);font-family:Arial,Helvetica,sans-serif;font-size:.95rem;gap:8px}
li .d{color:var(--muted);font-size:.85rem;margin-left:auto}
li button.link{padding:2px 6px}
.empty{color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:.9rem;margin:12px 0 0}
.status{text-align:center;color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:.75rem;margin-top:8px;min-height:1em}
.confirm{display:none;margin-top:12px;padding:12px;border:1px solid var(--danger);border-radius:10px;font-family:Arial,Helvetica,sans-serif;font-size:.9rem}
.confirm.show{display:block}
.confirm .btns{margin-top:10px;justify-content:flex-start}
.done{color:var(--accent);font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bible Reading Tracker</h1>
  <p class="sub">Read all 1,189 chapters, one at a time</p>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="num" id="readN">0</div><div class="lbl">Chapters read</div></div>
      <div class="stat"><div class="num" id="leftN">1189</div><div class="lbl">Yet to read</div></div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="1189" id="bar"><div id="fill"></div></div>
    <div class="pct" id="pct">0% complete</div>
  </div>

  <div class="card center">
    <div class="seg" role="group" aria-label="Choose from">
      <button type="button" data-scope="all" aria-pressed="true">Whole Bible</button>
      <button type="button" data-scope="ot" aria-pressed="false">Old Testament</button>
      <button type="button" data-scope="nt" aria-pressed="false">New Testament</button>
    </div>
    <div class="pick" id="pick" aria-live="polite">
      <div class="hint">Press Select to get a random chapter</div>
    </div>
    <div class="btns">
      <button type="button" class="primary" id="selectBtn">Select</button>
      <button type="button" id="markBtn" disabled>Mark as read</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <h2>Chapters read</h2>
      <button type="button" class="danger" id="clearBtn" disabled>Clear all</button>
    </div>
    <div class="confirm" id="confirm">
      <div>Clear all read chapters and start over? This can't be undone.</div>
      <div class="btns">
        <button type="button" class="danger" id="confirmYes">Yes, clear</button>
        <button type="button" id="confirmNo">Cancel</button>
      </div>
    </div>
    <p class="empty" id="empty">Nothing yet. Select a chapter and mark it as read.</p>
    <ul id="list"></ul>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
const BOOKS=[["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
const CHAPTERS=[]; // {name, ot}
BOOKS.forEach(([b,c],bi)=>{for(let i=1;i<=c;i++)CHAPTERS.push({name:b+" "+i,ot:bi<39});});
const TOTAL=CHAPTERS.length; // 1189
const NAME_TO_IDX=new Map(CHAPTERS.map((c,i)=>[c.name,i]));

const KEY="bibleTracker.v1";
// state: read = {chapterName: {date, ts}}, current = chapterName|null, scope, updatedAt
let state={read:{},current:null,scope:"all",updatedAt:0};
let db=null, docRef=null;

const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmt=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});};

function sanitize(s){
  const out={read:{},current:null,scope:"all",updatedAt:0};
  if(!s||typeof s!=="object")return out;
  if(s.read&&typeof s.read==="object")for(const k of Object.keys(s.read)){
    if(NAME_TO_IDX.has(k)&&s.read[k]&&typeof s.read[k].date==="string")out.read[k]={date:s.read[k].date,ts:+s.read[k].ts||0};
  }
  if(typeof s.current==="string"&&NAME_TO_IDX.has(s.current)&&!out.read[s.current])out.current=s.current;
  if(["all","ot","nt"].includes(s.scope))out.scope=s.scope;
  out.updatedAt=+s.updatedAt||0;
  return out;
}

function loadLocal(){
  try{const raw=localStorage.getItem(KEY);if(raw)return sanitize(JSON.parse(raw));}catch(e){}
  return null;
}
function saveLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
let saveTimer=null;
function persist(){
  state.updatedAt=Date.now();
  saveLocal();
  if(!docRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await docRef.set(JSON.parse(JSON.stringify(state)));setStatus("Saved");}
    catch(e){setStatus("Saved on this device only");}
  },400);
}
function setStatus(t){$("status").textContent=t;}

function inScope(i){
  return state.scope==="all"||(state.scope==="ot"?CHAPTERS[i].ot:!CHAPTERS[i].ot);
}
function unreadIdx(){
  const r=[];for(let i=0;i<TOTAL;i++)if(inScope(i)&&!state.read[CHAPTERS[i].name])r.push(i);return r;
}

function render(){
  const n=Object.keys(state.read).length;
  $("readN").textContent=n;
  $("leftN").textContent=TOTAL-n;
  $("fill").style.width=(n/TOTAL*100)+"%";
  $("bar").setAttribute("aria-valuenow",n);
  $("pct").textContent=(n/TOTAL*100).toFixed(1)+"% complete";

  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.scope===state.scope)));

  const pick=$("pick");pick.textContent="";
  const left=unreadIdx().length;
  if(state.current){
    const t=document.createElement("div");t.className="tag";t.textContent="Your chapter to read";
    const c=document.createElement("div");c.className="chap";c.textContent=state.current;
    pick.append(t,c);
  }else if(left===0){
    const h=document.createElement("div");h.className="chap done";
    h.textContent=n===TOTAL?"You've read the whole Bible!":"Everything here is read!";
    pick.append(h);
  }else{
    const h=document.createElement("div");h.className="hint";h.textContent="Press Select to get a random chapter";pick.append(h);
  }
  $("selectBtn").disabled=left===0;
  $("selectBtn").textContent=state.current?"Select another":"Select";
  $("markBtn").disabled=!state.current;
  $("clearBtn").disabled=n===0;

  const list=$("list");list.textContent="";
  const items=Object.entries(state.read).sort((a,b)=>(b[1].ts-a[1].ts)||b[1].date.localeCompare(a[1].date));
  $("empty").style.display=items.length?"none":"block";
  items.forEach(([name,v])=>{
    const li=document.createElement("li");
    const s=document.createElement("span");s.textContent=name;
    const d=document.createElement("span");d.className="d";d.textContent=fmt(v.date);
    const u=document.createElement("button");u.type="button";u.className="link";u.textContent="Undo";
    u.setAttribute("aria-label","Mark "+name+" as unread");
    u.onclick=()=>{delete state.read[name];persist();render();};
    li.append(s,d,u);list.append(li);
  });
}

$("selectBtn").onclick=()=>{
  const pool=unreadIdx();
  if(!pool.length)return;
  let idx;
  do{idx=pool[Math.floor(Math.random()*pool.length)];}
  while(pool.length>1&&CHAPTERS[idx].name===state.current);
  state.current=CHAPTERS[idx].name;
  persist();render();
};
$("markBtn").onclick=()=>{
  if(!state.current)return;
  state.read[state.current]={date:today(),ts:Date.now()};
  state.current=null;
  persist();render();
};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  state.scope=b.dataset.scope;
  if(state.current&&!inScope(NAME_TO_IDX.get(state.current)))state.current=null;
  persist();render();
});
$("clearBtn").onclick=()=>{$("confirm").classList.add("show");};
$("confirmNo").onclick=()=>{$("confirm").classList.remove("show");};
$("confirmYes").onclick=()=>{
  state.read={};state.current=null;
  $("confirm").classList.remove("show");
  persist();render();
};

// init: local first, then sync with the viewer's private store if available
const local=loadLocal();
if(local)state=local;
render();

(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [d,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!user)return;
    const uid=await user.id();
    if(!uid)return;
    db=d;
    docRef=db.doc("data/users/"+uid+"/progress");
    const snap=await docRef.get();
    if(snap.exists){
      const remote=sanitize(snap.data());
      if(remote.updatedAt>state.updatedAt){state=remote;saveLocal();render();}
      else if(state.updatedAt>remote.updatedAt){persist();}
    }else if(Object.keys(state.read).length||state.current){persist();}
    setStatus("Synced");
  }catch(e){docRef=null;}
})();
</script>
</body>
</html>
